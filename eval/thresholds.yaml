# STOP-condition thresholds. Owned by the human; agents do not edit this file.
# eval/run.py --check compares every metric below on --split all (dev + holdout) and per domain.
# Change a number only with a written reason in source-of-truth/04-rules/CONSTRAINTS.md.

min_cases:
  dev_base_per_domain: 20        # clothing, furniture, tools
  dev_total: 240                 # 60 bases x (1 + 3 variants)
  holdout_total: 30

retrieval:
  family_recall_at_3: 0.95       # correct family among the top-3 shown to the user
  out_of_scope_precision: 0.90   # when we say "out of scope", it really is

classification:
  final_code_accuracy: 0.92      # cases with a unique gold code: exact code AND version
  false_unique_rate_max: 0.03    # gold says ambiguous, system finalized anyway
  alive_superset_recall: 0.97    # ambiguous gold: every gold code still alive
  questions_to_final_p50_max: 2  # clarifications needed when the text is incomplete

extraction:
  value_unit_accuracy: 0.95      # bound values: number, unit, operator, bounds
  binding_accuracy: 0.93         # assertion -> correct characteristic of the correct position
  unsupported_value_rate_max: 0.01  # values with no span / answer / catalog source (hallucinations)
  forbidden_fill_rate_max: 0.0   # e.g. gender filled from a clothing size

diagnostics:
  recall: 0.85                   # expected diagnostics found (by kind)
  false_alarm_rate_max: 0.10     # diagnostics on clean cases
  silent_change_rate_max: 0.0    # values changed without a diagnostic or user action

latency_ms:                      # measured in-process on the demo machine, warm
  parse_p95: 150
  analyze_p95: 2500

resources:
  peak_vram_gb_max: 24           # well below the 40 GB rule; lighter scores better
